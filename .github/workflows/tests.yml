name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - name: Build the native kernel
        run: python -c "from stonkfly.neural.brain import build; print(build())"
        env:
          STONKFLY_DATA: kernel-build
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
