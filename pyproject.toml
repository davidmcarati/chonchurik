[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stonkfly"
version = "0.1.0"
description = "An experimental fly-connectome controller with guarded Coinbase AgentKit trading actions"
requires-python = ">=3.11"
dependencies = [
  "coinbase-agentkit==0.7.4", "coinbase-advanced-py==1.8.4",
  "numpy==2.4.6", "pandas==3.0.5", "pyarrow==25.0.1", "Pillow==12.3.0",
  "pydantic==2.13.5", "python-dotenv==1.2.3"
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
# Only to build the watch executable; nothing imports it.
build = ["pyinstaller==6.22.3"]

[project.scripts]
stonkfly = "stonkfly.cli:main"

[tool.setuptools.packages.find]
include = ["stonkfly*"]

[tool.setuptools.package-data]
"stonkfly.neural" = ["*.cpp", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
